<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docs — Plugg</title>
  <link rel="icon" type="image/png" href="img/plugg-logo.png?v=3" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0f1222; --ink2:#2a2e45; --muted:#6b7186; --line:#e7e8ef; --bg:#f6f7fb;
            --violet:#8b5cf6; --grad:linear-gradient(135deg,#6366f1,#8b5cf6 45%,#ec4899); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink2);
           font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.7; }
    .topbar { position:sticky; top:0; z-index:5; background:var(--grad); color:#fff;
              padding:11px 20px; display:flex; align-items:center; gap:10px; font-weight:700;
              box-shadow:0 2px 14px rgba(15,18,34,.12); }
    .topbar img { width:26px; height:26px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    .topbar .file { font-weight:500; opacity:.9; font-size:.9rem; }
    .topbar a { margin-left:auto; color:#fff; text-decoration:none; font-size:.83rem;
                border:1px solid rgba(255,255,255,.55); padding:5px 12px; border-radius:999px; }
    .topbar a:hover { background:rgba(255,255,255,.18); }
    .wrap { max-width:880px; margin:30px auto; padding:0 20px 90px; }
    .markdown-body { background:#fff; border:1px solid var(--line); border-radius:20px;
                     padding:clamp(22px,5vw,56px); box-shadow:0 16px 40px -22px rgba(15,18,34,.25); min-height:200px; }
    .markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4 { color:var(--ink); letter-spacing:-.02em; line-height:1.25; }
    .markdown-body h1 { font-size:2.1rem; margin:0 0 .4em; }
    .markdown-body h2 { font-size:1.55rem; margin:1.7em 0 .55em; padding-bottom:.3em; border-bottom:1px solid var(--line); }
    .markdown-body h3 { font-size:1.2rem; margin:1.4em 0 .4em; }
    .markdown-body p { margin:0 0 1em; }
    .markdown-body a { color:var(--violet); font-weight:600; }
    .markdown-body ul,.markdown-body ol { padding-left:1.4em; margin:0 0 1em; }
    .markdown-body li { margin:.3em 0; }
    .markdown-body hr { border:0; border-top:1px solid var(--line); margin:2em 0; }
    .markdown-body blockquote { margin:0 0 1em; padding:10px 18px; color:var(--ink2);
       background:linear-gradient(135deg,rgba(99,102,241,.10),rgba(236,72,153,.10));
       border-left:4px solid var(--violet); border-radius:0 8px 8px 0; }
    .markdown-body blockquote p { margin:0; }
    .markdown-body code { background:#f3f4f8; border:1px solid var(--line); border-radius:6px;
       padding:2px 6px; font-size:.88em; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#b4318f; }
    .markdown-body pre { background:#0f1222; color:#e7e8ef; border-radius:14px; padding:18px; overflow:auto; margin:0 0 1.2em; }
    .markdown-body pre code { background:none; border:0; padding:0; color:inherit; font-size:.86em; }
    .markdown-body table { border-collapse:collapse; margin:0 0 1.2em; font-size:.93rem; display:block; overflow-x:auto; }
    .markdown-body th,.markdown-body td { border:1px solid var(--line); padding:10px 14px; text-align:left; vertical-align:top; }
    .markdown-body th { background:#f3f4f8; font-weight:700; color:var(--ink); white-space:nowrap; }
    .markdown-body tr:nth-child(2n) td { background:#fbfbfe; }
    .markdown-body img { max-width:100%; }
    .status { text-align:center; color:var(--muted); padding:40px 0; }
    .status.err { color:#dc2626; }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="img/plugg-logo.png?v=3" alt="Plugg" /> Plugg docs
    <span class="file" id="fileName">· README.md</span>
    <a id="rawLink" href="README.md" target="_blank" rel="noopener">View raw</a>
  </div>

  <div class="wrap">
    <!-- Blank initially — JS fetches README.md and renders at runtime. -->
    <div class="markdown-body" id="doc"></div>
  </div>

  <!-- Runtime: marked.js (Markdown parser) + DOMPurify (sanitizer) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    (function () {
      var doc = document.getElementById("doc");

      // Supports ?file=OTHER.md to render any .md in the same folder.
      var params = new URLSearchParams(location.search);
      var file = params.get("file") || "README.md";
      document.getElementById("fileName").textContent = "· " + file;
      document.getElementById("rawLink").setAttribute("href", file);

      fetch(file, { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (md) {
          if (!window.marked) throw new Error("marked.js failed to load.");
          marked.setOptions({ gfm: true, breaks: false });
          var rawHtml = marked.parse(md);
          var clean = window.DOMPurify ? DOMPurify.sanitize(rawHtml) : rawHtml;
          doc.innerHTML = clean;
          document.title = (md.match(/^#\s+(.+)$/m) || [null, "Docs"])[1] + " — Plugg";
        })
        .catch(function (err) {
          doc.innerHTML = '<p class="status err">Could not render <strong>' + file +
            "</strong>: " + (err && err.message ? err.message : err) + "</p>";
        });
    })();
  </script>
</body>
</html>
