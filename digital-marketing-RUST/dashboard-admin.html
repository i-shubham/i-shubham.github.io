<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Plugg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/plugg-logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="theme-admin">
  <div id="nav"></div>

  <div class="dash">
    <div class="dash-backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sb-avatar">🛡️</div>
        <div><div class="sb-role">Admin</div><div class="sb-name" id="sbName">…</div></div>
      </div>
      <nav class="sb-nav">
        <div class="sb-section">Control</div>
        <div class="sb-link active" data-panel="overview"><span class="i">📊</span> Revenue</div>
        <div class="sb-link" data-panel="users"><span class="i">👥</span> Users</div>
        <div class="sb-link" data-panel="config"><span class="i">⚙️</span> Fee settings</div>
        <div class="sb-link" data-panel="data"><span class="i">🗄️</span> Demo data</div>
      </nav>
      <div class="sidebar-foot" id="sbFoot"></div>
    </aside>

    <main class="dash-main">
      <div class="page-head">
        <div class="flex items-center gap">
          <button class="btn btn-ghost btn-sm" id="menuBtn" style="display:none">☰</button>
          <div><h1 id="pageTitle">Revenue</h1><div class="muted" id="pageSub">Platform earnings & activity</div></div>
        </div>
      </div>

      <section class="panel active" id="panel-overview"></section>
      <section class="panel" id="panel-users"></section>
      <section class="panel" id="panel-config"></section>
      <section class="panel" id="panel-data"></section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
